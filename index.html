<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Hub</title>
<style>
  :root {
    --bg: #14151a;
    --card: #1e2028;
    --card-hover: #272a35;
    --text: #eceef3;
    --muted: #9aa0b0;
    --accent: #ff6b3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 8px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  header p { margin: 0; color: var(--muted); }

  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 48px; }

  #search {
    width: 100%;
    max-width: 360px;
    padding: 10px 14px;
    margin: 12px 0 20px;
    border-radius: 10px;
    border: 1px solid #343845;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
  }

  /* ---------- Game grid ---------- */
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .game {
    all: unset;
    cursor: pointer;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    transition: transform .12s ease, background .12s ease;
    display: flex;
    flex-direction: column;
  }
  .game:hover, .game:focus-visible { background: var(--card-hover); transform: translateY(-3px); }
  .game:focus-visible { outline: 2px solid var(--accent); }
  .thumb {
    aspect-ratio: 16 / 10;
    background: linear-gradient(135deg, #3a3f55, #1e2028);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem; font-weight: 700; color: var(--accent);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 10px 12px 14px; }
  .title { font-weight: 600; }
  .cat { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  #empty { color: var(--muted); display: none; }

  /* ---------- Player view ---------- */
  #player { display: none; }
  #bar {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  #bar h2 { margin: 0; font-size: 1.2rem; flex: 1; }
  button.ctl {
    background: var(--card);
    color: var(--text);
    border: 1px solid #343845;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: .95rem;
    cursor: pointer;
  }
  button.ctl:hover { background: var(--card-hover); }
  #frame-wrap {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 16 / 10;
    width: 100%;
  }
  #frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  #credit { color: var(--muted); font-size: .85rem; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>Game Hub</h1>
  <p>Pick a game and play it right here.</p>
</header>

<main>
  <!-- Game list view -->
  <section id="library">
    <input id="search" type="search" placeholder="Search games..." aria-label="Search games">
    <div id="grid"></div>
    <p id="empty">No games match that search.</p>
  </section>

  <!-- Game player view -->
  <section id="player">
    <div id="bar">
      <button class="ctl" id="back">&larr; All games</button>
      <h2 id="player-title"></h2>
      <button class="ctl" id="reload">Reload</button>
      <button class="ctl" id="fullscreen">Fullscreen</button>
    </div>
    <div id="frame-wrap"></div>
    <div id="credit"></div>
  </section>
</main>

<script>
/* ==========================================================
   ADD YOUR GAMES HERE
   One entry per game. Copy a block, change the values.

   id:       short unique name, no spaces (used in the URL)
   title:    name shown on the button
   category: label under the title (Puzzle, Arcade, etc.)
   path:     link to the game's index.html (a folder in your site
             like "games/my-game/index.html", or a full https:// URL
             for a game whose owner allows embedding)
   thumb:    optional image path, e.g. "games/my-game/thumb.png"
             (leave "" to show a letter instead)
   credit:   optional line shown under the game, e.g. author + licence
   ========================================================== */
const GAMES = [
  {
    id: "example-one",
    title: "Example Game One",
    category: "Puzzle",
    path: "games/example-one/index.html",
    thumb: "",
    credit: "Made by You. MIT licence."
  },
  {
    id: "example-two",
    title: "Example Game Two",
    category: "Arcade",
    path: "games/example-two/index.html",
    thumb: "",
    credit: ""
  }
];

/* ---------- Everything below runs the site; you shouldn't need to edit it ---------- */
const grid = document.getElementById("grid");
const emptyMsg = document.getElementById("empty");
const library = document.getElementById("library");
const player = document.getElementById("player");
const frameWrap = document.getElementById("frame-wrap");
const search = document.getElementById("search");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderGrid(filter = "") {
  const q = filter.trim().toLowerCase();
  const shown = GAMES.filter(g =>
    g.title.toLowerCase().includes(q) || (g.category || "").toLowerCase().includes(q)
  );
  grid.innerHTML = shown.map(g => `
    <button class="game" data-id="${escapeHtml(g.id)}">
      <div class="thumb">
        ${g.thumb ? `<img src="${escapeHtml(g.thumb)}" alt="" loading="lazy">` : escapeHtml(g.title.charAt(0))}
      </div>
      <div class="info">
        <div class="title">${escapeHtml(g.title)}</div>
        <div class="cat">${escapeHtml(g.category || "")}</div>
      </div>
    </button>
  `).join("");
  emptyMsg.style.display = shown.length ? "none" : "block";
}

function openGame(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) { showLibrary(); return; }
  document.getElementById("player-title").textContent = g.title;
  document.getElementById("credit").textContent = g.credit || "";
  frameWrap.innerHTML = "";
  const iframe = document.createElement("iframe");
  iframe.src = g.path;
  iframe.title = g.title;
  iframe.allow = "autoplay; fullscreen; gamepad";
  iframe.allowFullscreen = true;
  iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-pointer-lock allow-popups");
  frameWrap.appendChild(iframe);
  library.style.display = "none";
  player.style.display = "block";
  document.title = g.title + " - Game Hub";
  window.scrollTo(0, 0);
}

function showLibrary() {
  frameWrap.innerHTML = "";          // stops the game and its audio
  player.style.display = "none";
  library.style.display = "block";
  document.title = "Game Hub";
}

/* Clicking a game button sets the URL hash (#example-one), so the browser's
   back button works and you can share a direct link to a game. */
grid.addEventListener("click", e => {
  const btn = e.target.closest(".game");
  if (btn) location.hash = btn.dataset.id;
});
document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
document.getElementById("reload").addEventListener("click", () => {
  const f = frameWrap.querySelector("iframe");
  if (f) f.src = f.src;
});
document.getElementById("fullscreen").addEventListener("click", () => {
  const f = frameWrap.querySelector("iframe");
  if (f && f.requestFullscreen) f.requestFullscreen();
});
search.addEventListener("input", () => renderGrid(search.value));

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id) openGame(id); else showLibrary();
}
window.addEventListener("hashchange", route);

renderGrid();
route();
</script>
</body>
</html>
